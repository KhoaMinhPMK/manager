<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WAIEDU - Đăng nhập</title>
  <!-- Thêm Google Font Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <!-- Thêm Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="logo-container">
        <div class="logo-img">
          <i class="fas fa-graduation-cap logo-icon"></i>
        </div>
        <h1 class="logo">WAIEDU</h1>
      </div>
      <p class="login-subtitle">Hệ thống quản lý dự án</p>
      
      <form id="loginForm">
        <div class="input-group">
          <label for="username">Tên đăng nhập</label>
          <div class="input-with-icon">
            <i class="fas fa-user input-icon"></i>
            <input type="text" id="username" name="username" placeholder="Nhập tên đăng nhập" required />
          </div>
        </div>
        <div class="input-group">
          <label for="password">Mật khẩu</label>
          <div class="input-with-icon password-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required />
            <button type="button" class="toggle-password" aria-label="Hiện mật khẩu"><i class="far fa-eye"></i></button>
          </div>
        </div>
        <div class="remember-me">
          <label class="checkbox-container">
            <input type="checkbox" id="remember">
            <span class="checkmark"></span>
            Ghi nhớ đăng nhập
          </label>
        </div>
        <button type="submit" class="btn-login">
          <span class="btn-text">Đăng nhập</span>
          <span class="btn-loader"><i class="fas fa-circle-notch fa-spin"></i></span>
        </button>
      </form>
      
      <div class="auth-links">
        <p class="forgot"><a href="#"><i class="fas fa-key"></i> Quên mật khẩu?</a></p>
      </div>
      
      <div class="login-footer">
        <p>&copy; 2025 WAIEDU. Tất cả các quyền được bảo lưu.</p>
      </div>
    </div>
  </div>
  <script src="scripts.js"></script>
</body>
</html>
