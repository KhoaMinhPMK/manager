<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAIEDU - Hệ thống Quản lý Dự án</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-project-diagram"></i>
                </div>
                <h1>WAIEDU</h1>
                <p>Hệ thống Quản lý Dự án và Nhân sự</p>
            </div>
            <div class="login-content">
                <h2 style="text-align: center;">Đăng nhập</h2>
                <!-- <p>Chào mừng trở lại! Hãy đăng nhập để tiếp tục công việc của bạn.</p> -->
                <div class="login-form">
                    <div class="form-group">
                        <label for="username">Tên đăng nhập hoặc Email</label>
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input type="text" id="username" placeholder="Nhập tên đăng nhập hoặc email">
                        </div>
                        <div class="error-message" id="username-error"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Mật khẩu</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" placeholder="Nhập mật khẩu">
                            <i class="fas fa-eye-slash toggle-password"></i>
                        </div>
                        <div class="error-message" id="password-error"></div>
                    </div>
                    
                    <div class="form-options">
                        <div class="remember-me">
                            <input type="checkbox" id="remember">
                            <label for="remember">Ghi nhớ đăng nhập</label>
                        </div>
                        <a href="forgot-password.html" class="forgot-password">Quên mật khẩu?</a>
                    </div>
                    
                    <button type="button" class="login-button" id="login-btn">
                        <span>Đăng nhập</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                    
                    <div class="divider">
                        <span>hoặc</span>
                    </div>
                    
                    <div class="social-login">
                        <button class="google-btn">
                            <i class="fab fa-google"></i>
                            <span>Đăng nhập với Google</span>
                        </button>
                        <button class="microsoft-btn">
                            <i class="fab fa-microsoft"></i>
                            <span>Đăng nhập với Microsoft</span>
                        </button>
                    </div>
                    
                    <div class="register-link">
                        Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
